name: ChatManager
version: '6.7'
main: org.me.chatManager.ChatManager
api-version: '1.21.11'
author: _MasterZero
description: Advanced chat moderation, anti-spam, filtering, and utility commands.


commands:

  broadcast:
    description: Broadcast a message to all players.
    usage: /broadcast <message>
    aliases: [bc]
    permission: chatmanager.broadcast


  chatmanager:
    description: Reloads the ChatManager configuration.
    usage: /chatmanager reload
    aliases: [ cm ]
    permission: chatmanager.reload


  ignore:
    description: Ignore a player.
    usage: /ignore <player>
    permission: chatmanager.ignore


  ignorelist:
    description: View ignored players.
    usage: /ignorelist
    aliases: [ignored]
    permission: chatmanager.ignore


  joindate:
    description: Check when a player first joined the server.
    usage: /joindate [player]
    aliases: [jd]
    permission: chatmanager.joindate


  msg:
    description: Whisper to a player.
    usage: /msg <player> <message>
    aliases: [tell, whisper, w]
    permission: chatmanager.whisper


  reply:
    description: Reply to the last whisper.
    usage: /reply <message>
    aliases: [r]
    permission: chatmanager.whisper


  suicide:
    description: Instantly kills yourself.
    usage: /suicide
    aliases: [kill]
    permission: chatmanager.suicide


  unignore:
    description: Stop ignoring a player.
    usage: /unignore <player>
    permission: chatmanager.ignore


  togglechat:
    description: Toggle chat messages on/off.
    usage: /togglechat
    permission: chatmanager.toggle.chat


  toggletells:
    description: Toggle private messages on/off.
    usage: /toggletells
    permission: chatmanager.toggle.tells


  toggleconnectionmsgs:
    description: Toggle connection messages on/off.
    usage: /toggleconnectionmsgs
    permission: chatmanager.toggle.connection


  stats:
    description: View server statistics.
    usage: /stats
    permission: chatmanager.stats


permissions:


  # ======================================================
  # Chat Moderation
  # ======================================================


  chatmanager.bypass.cooldown:
    description: Bypass chat cooldown.
    default: false


  chatmanager.bypass.duplicate:
    description: Bypass duplicate message detection.
    default: false


  chatmanager.bypass.spam:
    description: Bypass anti-spam checks.
    default: false


  chatmanager.bypass.phrases:
    description: Bypass phrase filtering.
    default: false


  chatmanager.notify:
    description: Receive chat moderation alerts.
    default: op


  # ======================================================
  # Chat Features
  # ======================================================


  chatmanager.color:
    description: Allows usage of chat colors.
    default: false


  chatmanager.broadcast:
    description: Allows broadcasting messages.
    default: op


  # ======================================================
  # Ignore System
  # ======================================================


  chatmanager.ignore:
    description: Allows ignoring players.
    default: true


  chatmanager.ignore.bypass:
    description: Bypass ignore restrictions.
    default: op


  # ======================================================
  # Commands
  # ======================================================


  chatmanager.joindate:
    description: Allows using /joindate.
    default: true


  chatmanager.reload:
    description: Allows reloading ChatManager.
    default: op


  chatmanager.suicide:
    description: Allows using /suicide.
    default: true


  chatmanager.whisper:
    description: Allows private messaging.
    default: true


  chatmanager.whisper.spy:
    description: Allows viewing private messages.
    default: op


  chatmanager.whisper.color:
    description: Allows using color codes in private messages.
    default: false


  # ======================================================
  # Toggle System
  # ======================================================


  chatmanager.toggle.chat:
    description: Allows toggling chat visibility.
    default: true


  chatmanager.toggle.tells:
    description: Allows toggling private messages.
    default: true


  chatmanager.toggle.connection:
    description: Allows toggling connection messages.
    default: true


  # ======================================================
  # Statistics
  # ======================================================


  chatmanager.stats:
    description: Allows viewing server statistics.
    default: true